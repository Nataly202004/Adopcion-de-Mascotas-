<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopción de Mascotas - Iniciar Sesión</title>
    <!-- Cargamos Tailwind CSS para un diseño hermoso -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md transform transition-all hover:scale-[1.01]">
        <!-- Encabezado / Logo simulado -->
        <div class="text-center mb-8">
            <span class="text-4xl">🐾</span>
            <h1 class="text-3xl font-extrabold text-gray-800 mt-2">¡Bienvenidos!</h1>
            <p class="text-sm text-gray-500 mt-1">Ingresa al sistema de adopción de mascotas</p>
        </div>

        <!-- Formulario de Entrada -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" id="correo" required placeholder="ejemplo@correo.com" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="contrasena" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
            </div>

            <!-- Botón de Envío animado -->
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-indigo-500/30 transition-all duration-200 transform active:scale-95">
                Ingresar al Sistema
            </button>
        </form>

        <!-- Contenedor de Alertas Dinámicas -->
        <div id="mensajeAlerta" class="mt-4 text-center text-sm font-medium hidden p-3 rounded-xl"></div>
    </div>

    <!-- Script de conexión con tu Backend de Node.js -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue sola
            
            const correo = document.getElementById('correo').value;
            const contrasena = document.getElementById('contrasena').value;
            const alerta = document.getElementById('mensajeAlerta');

            // Limpiamos alertas previas
            alerta.classList.add('hidden');

            try {
                // Hacemos la llamada real a tu API corriendo en el puerto 3000
                const respuesta = await fetch('https://curly-space-invention-r775wx9jwp99fp9p6-3000.app.github.dev/api/usuarios/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, contrasena })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    // Login Exitoso
                    alerta.innerText = `¡Bienvenido ${datos.usuario.nombre_completo}! Redirigiendo...`;
                    alerta.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl bg-green-100 text-green-800";
                    alerta.classList.remove('hidden');

                    // Guardamos la sesión en el navegador temporalmente
                    localStorage.setItem('usuarioLogueado', JSON.stringify(datos.usuario));

                    // Redirección inteligente según el ROL de la base de datos
                    setTimeout(() => {
                                   if (datos.usuario.rol === 'admin') {
                alert("Acceso concedido: ¡Eres el Administrador! Entrando al panel de gestión.");
                window.location.href = '/catalogo';
            } else {
                alert("Acceso concedido: ¡Eres un Adoptante! Entrando al catálogo de mascotas.");
                window.location.href = '/catalogo';
            }

                    }, 1500);

                } else {
                    // Error devuelto por tu Backend (Credenciales incorrectas)
                    alerta.innerText = datos.error || 'Error al iniciar sesión';
                    alerta.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl bg-red-100 text-red-800";
                    alerta.classList.remove('hidden');
                }

            } catch (error) {
                console.error(error);
                alerta.innerText = 'No se pudo conectar con el servidor backend';
                alerta.className = "mt-4 text-center text-sm font-medium p-3 rounded-xl bg-amber-100 text-amber-800";
                alerta.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
