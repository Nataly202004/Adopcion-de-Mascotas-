<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas Felices - Acceso</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #34d399 0%, #0d9488 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .tarjeta-login { background: white; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 40px rgba(11, 94, 89, 0.25); width: 100%; max-width: 420px; }
        .banner-mascotas { background-color: #115e59; color: white; padding: 30px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .banner-mascotas .emoji-pets { font-size: 55px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        .banner-mascotas h2 { margin: 0; font-size: 28px; font-weight: 800; }
        .banner-mascotas p { margin: 5px 0 0 0; font-size: 14px; color: #ccfbf1; font-style: italic; }
        .contenedor-formulario { padding: 35px 30px; text-align: center; }
        .contenedor-formulario h3 { margin: 0 0 5px 0; color: #115e59; font-size: 24px; font-weight: 800; }
        .contenedor-formulario .sub { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .grupo-entrada { text-align: left; margin-bottom: 18px; }
        .fila-doble { display: flex; gap: 15px; }
        .fila-doble .grupo-entrada { flex: 1; }
        label { display: block; font-size: 12.5px; font-weight: 700; color: #115e59; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-size: 14.5px; color: #1e293b; background-color: #f8fafc; transition: all 0.2s; }
        input:focus { outline: none; border-color: #34d399; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15); }
        button { width: 100%; background: #0d9488; color: white; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        button:hover { background: #115e59; }
        .enlace-cambio { margin-top: 20px; font-size: 14px; color: #475569; }
        .enlace-cambio a { color: #0d9488; font-weight: 700; cursor: pointer; }
        .enlace-cambio a:hover { text-decoration: underline; }
        .alerta { margin-top: 15px; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; display: none; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>

    <div class="tarjeta-login">
        <div class="banner-mascotas">
            <div class="emoji-pets">🐶❤️🐱</div>
            <h2>Huellas Felices</h2>
            <p>"No puedes comprar el amor, pero puedes adoptarlo"</p>
        </div>

        <div class="contenedor-formulario" id="seccionLogin">
            <h3>¡Bienvenidos de vuelta!</h3>
            <p class="sub">Ingresa tus credenciales para acceder</p>
            <form id="loginForm">
                <div class="grupo-entrada">
                    <label>Correo Electrónico</label>
                    <input type="email" id="correoLogin" required placeholder="ejemplo@correo.com">
                </div>
                <div class="grupo-entrada">
                    <label>Contraseña</label>
                    <input type="password" id="contrasenaLogin" required placeholder="••••••••">
                </div>
                <button type="submit">Ingresar al Sistema 🐾</button>
            </form>
            <div class="enlace-cambio">
                ¿Eres nuevo aquí? <a onclick="mostrarRegistro()">Regístrate aquí</a>
            </div>
            <div id="alertaLogin" class="alerta"></div>
        </div>

        <div class="contenedor-formulario" id="seccionRegistro" style="display: none;">
            <h3>Crear una Cuenta</h3>
            <p class="sub">Únete a nosotros y adopta un amigo</p>
            <form id="registroForm">
                <div class="fila-doble">
                    <div class="grupo-entrada">
                        <label>Nombres</label>
                        <input type="text" id="nombreRegistro" required placeholder="Nombres">
                    </div>
                    <div class="grupo-entrada">
                        <label>Apellidos</label>
                        <input type="text" id="apellidoRegistro" required placeholder="Apellidos">
                    </div>
                </div>
                <div class="grupo-entrada">
                    <label>Correo Electrónico</label>
                    <input type="email" id="correoRegistro" required placeholder="ejemplo@correo.com">
                </div>
                <div class="grupo-entrada">
                    <label>Contraseña</label>
                    <input type="password" id="contrasenaRegistro" required placeholder="Crea una contraseña">
                </div>
                <button type="submit">Registrarme 🐾</button>
            </form>
            <div class="enlace-cambio">
                ¿Ya tienes cuenta? <a onclick="mostrarLogin()">Inicia sesión aquí</a>
            </div>
            <div id="alertaRegistro" class="alerta"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
    <script>
        // Conexión directa con Supabase (el sitio se publica en GitHub Pages, que no
        // ejecuta backend). La clave publishable es pública por diseño: lo que cada
        // visitante puede hacer lo limitan las políticas RLS de supabase/setup.sql.
        // Nunca pongas aquí la service_role key ni la contraseña de la base.
        const SUPABASE_URL = 'https://ixagbxnskkhbkajlsaqg.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__JdwDHzW1iiCB0W0D126wg_GNxeDlLS';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function escaparHtml(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        async function cerrarSesion() {
            await sb.auth.signOut();
            localStorage.removeItem('usuarioLogueado');
            window.location.href = 'index.html';
        }

        function mostrarRegistro() {
            document.getElementById('seccionLogin').style.display = 'none';
            document.getElementById('seccionRegistro').style.display = 'block';
            document.getElementById('alertaLogin').style.display = 'none';
        }

        function mostrarLogin() {
            document.getElementById('seccionRegistro').style.display = 'none';
            document.getElementById('seccionLogin').style.display = 'block';
            document.getElementById('alertaRegistro').style.display = 'none';
        }

        function mostrarAlerta(alerta, mensaje, exito) {
            alerta.innerText = mensaje;
            alerta.style.backgroundColor = exito ? '#d1fae5' : '#fee2e2';
            alerta.style.color = exito ? '#065f46' : '#991b1b';
            alerta.style.border = exito ? '1px solid #a7f3d0' : '1px solid #fca5a5';
            alerta.style.display = 'block';
        }

        function mensajeDeError(error) {
            if (error?.name === 'AuthRetryableFetchError' || /fetch/i.test(error?.message || '')) {
                return 'Error de conexión. Revisa tu internet e intenta de nuevo.';
            }
            const porCodigo = {
                invalid_credentials: 'Credenciales incorrectas.',
                email_not_confirmed: 'Primero confirma tu correo: abre el enlace que te enviamos (revisa también la carpeta de spam).',
                user_already_exists: 'Ya existe una cuenta con ese correo.',
                email_exists: 'Ya existe una cuenta con ese correo.',
                weak_password: 'La contraseña es muy débil. Usa al menos 8 caracteres.',
                email_address_invalid: 'Ingresa un correo electrónico válido.',
                email_address_not_authorized: 'No se pudo enviar el correo de confirmación a esa dirección. Avisa al administrador del sitio.',
                over_email_send_rate_limit: 'Se enviaron demasiados correos. Espera unos minutos e intenta de nuevo.',
                over_request_rate_limit: 'Demasiados intentos. Espera unos minutos e intenta de nuevo.'
            };
            return porCodigo[error?.code] || error?.message || 'Ocurrió un error inesperado. Intenta nuevamente.';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = document.getElementById('correoLogin').value.trim().toLowerCase();
            const contrasena = document.getElementById('contrasenaLogin').value;
            const alerta = document.getElementById('alertaLogin');
            alerta.style.display = 'none';

            const { data, error } = await sb.auth.signInWithPassword({ email: correo, password: contrasena });
            if (error) {
                console.error('Error al iniciar sesión:', error);
                return mostrarAlerta(alerta, mensajeDeError(error), false);
            }

            const { data: perfil, error: errorPerfil } = await sb
                .from('perfil').select('nombre_completo, rol').eq('id', data.user.id).maybeSingle();
            if (errorPerfil) console.error('No se pudo leer el perfil:', errorPerfil);

            const usuario = {
                id: data.user.id,
                correo: data.user.email,
                nombre_completo: perfil?.nombre_completo || data.user.user_metadata?.nombre_completo || 'usuario',
                rol: perfil?.rol || 'usuario'
            };
            localStorage.setItem('usuarioLogueado', JSON.stringify(usuario));
            mostrarAlerta(alerta, `¡Bienvenido(a), ${usuario.nombre_completo}! ✨`, true);
            setTimeout(() => {
                window.location.href = usuario.rol === 'admin' ? 'admin.html' : 'catalogo.html';
            }, 1500);
        });

        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreRegistro').value.trim();
            const apellido = document.getElementById('apellidoRegistro').value.trim();
            const correo = document.getElementById('correoRegistro').value.trim().toLowerCase();
            const contrasena = document.getElementById('contrasenaRegistro').value;
            const alerta = document.getElementById('alertaRegistro');
            alerta.style.display = 'none';

            if (contrasena.length < 8) {
                return mostrarAlerta(alerta, 'La contraseña debe tener al menos 8 caracteres.', false);
            }

            const { data, error } = await sb.auth.signUp({
                email: correo,
                password: contrasena,
                options: {
                    data: { nombre_completo: `${nombre} ${apellido}`.trim() },
                    // A dónde vuelve el enlace de confirmación del correo.
                    emailRedirectTo: window.location.href.split(/[?#]/)[0]
                }
            });
            if (error) {
                console.error('Error al registrar:', error);
                return mostrarAlerta(alerta, mensajeDeError(error), false);
            }
            // Con la confirmación por correo activada, Supabase no revela si el correo
            // ya existía: devuelve un usuario sin identidades.
            if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                return mostrarAlerta(alerta, 'Ya existe una cuenta con ese correo.', false);
            }

            document.getElementById('registroForm').reset();
            if (data.session) {
                // Confirmación por correo desactivada: la cuenta ya está activa.
                await sb.auth.signOut();
                mostrarAlerta(alerta, '¡Cuenta creada con éxito! Ahora inicia sesión. ✨', true);
                setTimeout(mostrarLogin, 1500);
            } else {
                mostrarAlerta(alerta, `¡Cuenta creada! Te enviamos un correo a ${correo}. Abre el enlace para confirmarla y luego inicia sesión.`, true);
            }
        });
    </script>
</body>
</html>
