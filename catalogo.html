<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas Felices - Catálogo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0fdfa;
            color: #134e4a;
        }
        header {
            background: #115e59;
            color: white;
            padding: 24px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        header h1 { margin: 0; }
        header button {
            background: #f87171;
            border: 0;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
        }
        main { max-width: 1200px; margin: auto; padding: 35px 20px; }
        .presentacion { text-align: center; margin-bottom: 25px; }
        .filtros { text-align: center; margin-bottom: 25px; }
        .filtros button {
            border: 0;
            background: #99f6e4;
            color: #115e59;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .filtros button.activo { background: #0d9488; color: white; }
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }
        .animal {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 16px #0f766e22;
        }
        .animal img {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }
        .animal-info { padding: 18px; }
        .animal-info h3 { margin: 0 0 8px; color: #115e59; }
        .animal-info p { margin: 6px 0; color: #64748b; }
        .animal-info button, .formulario button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            background: #0d9488;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .animal-info button:hover, .formulario button:hover { background: #115e59; }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            inset: 0;
            background: #0008;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.visible { display: flex; }
        .contenido-modal {
            background: white;
            width: 100%;
            max-width: 520px;
            max-height: 95vh;
            overflow-y: auto;
            border-radius: 18px;
            padding: 25px;
            position: relative;
        }
        .cerrar {
            position: absolute;
            top: 12px;
            right: 18px;
            border: 0;
            background: none;
            font-size: 28px;
            color: #64748b;
            cursor: pointer;
        }
        .formulario label {
            display: block;
            margin-top: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .formulario input, .formulario textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }
        .formulario textarea { min-height: 100px; resize: vertical; }
        #resultado { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>🐾 Huellas Felices</h1>
        <button onclick="cerrarSesion()">Cerrar sesión</button>
    </header>

    <main>
        <section class="presentacion">
            <h2>Encuentra a tu nuevo mejor amigo</h2>
            <p>Conoce nuestros perros y gatos disponibles para adopción.</p>
        </section>

        <div class="filtros">
            <button class="activo" onclick="filtrar('todos', this)">Todos</button>
            <button onclick="filtrar('perro', this)">Perros</button>
            <button onclick="filtrar('gato', this)">Gatos</button>
        </div>

        <section id="catalogo" class="catalogo"></section>
    </main>

    <div id="modal" class="modal">
        <div class="contenido-modal">
            <button class="cerrar" onclick="cerrarModal()" aria-label="Cerrar">×</button>
            <h2>Solicitud de adopción</h2>
            <p id="mascotaSeleccionada"></p>

            <form id="formAdopcion" class="formulario">
                <input type="hidden" id="mascota">

                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" required>

                <label for="celular">Celular</label>
                <input id="celular" name="celular" type="tel" required>

                <label for="direccion">Dirección</label>
                <input id="direccion" name="direccion" type="text" required>

                <label for="correo">Correo</label>
                <input id="correo" name="correo" type="email" required>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje"
                    placeholder="Agrega detalles sobre la mascota y tu solicitud..."
                    required></textarea>

                <button type="submit">Enviar solicitud 🐾</button>
                <div id="resultado"></div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
    <script>
        // Conexión directa con Supabase (el sitio se publica en GitHub Pages, que no
        // ejecuta backend). La clave publishable es pública por diseño: lo que cada
        // visitante puede hacer lo limitan las políticas RLS de supabase/setup.sql.
        // Nunca pongas aquí la service_role key ni la contraseña de la base.
        const SUPABASE_URL = 'https://ixagbxnskkhbkajlsaqg.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__JdwDHzW1iiCB0W0D126wg_GNxeDlLS';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function escaparHtml(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        async function cerrarSesion() {
            await sb.auth.signOut();
            localStorage.removeItem('usuarioLogueado');
            window.location.href = 'index.html';
        }

        const FOTO_POR_DEFECTO = 'data:image/svg+xml,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" fill="#ccfbf1"/><text x="50%" y="50%" font-size="120" text-anchor="middle" dominant-baseline="central">🐾</text></svg>'
        );
        let animales = [];
        let tipoActual = 'todos';
        let mascotaElegida = null;

        async function cargarMascotas() {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '<p>Cargando mascotas...</p>';
            const { data, error } = await sb
                .from('mascota')
                .select('id_mascota, nombre, especie, raza, edad, foto_url')
                .eq('estado', 'disponible')
                .order('id_mascota');
            if (error) {
                console.error('Error al cargar las mascotas:', error);
                catalogo.innerHTML = '<p>No se pudieron cargar las mascotas. Recarga la página para intentarlo de nuevo.</p>';
                return;
            }
            animales = data;
            mostrarAnimales(tipoActual);
        }

        function mostrarAnimales(tipo = 'todos') {
            const lista = animales.filter((a) => tipo === 'todos' || String(a.especie).toLowerCase() === tipo);
            document.getElementById('catalogo').innerHTML = lista.length
                ? lista.map((a) => `
                    <article class="animal">
                        <img src="${escaparHtml(a.foto_url || FOTO_POR_DEFECTO)}" alt="${escaparHtml(a.nombre)}">
                        <div class="animal-info">
                            <h3>${escaparHtml(a.nombre)}</h3>
                            <p><strong>Especie:</strong> ${escaparHtml(a.especie)}</p>
                            <p><strong>Raza:</strong> ${escaparHtml(a.raza || 'Sin especificar')}</p>
                            <p><strong>Edad:</strong> ${escaparHtml(a.edad ?? '?')} año(s)</p>
                            <button data-id="${a.id_mascota}">Me interesa adoptar</button>
                        </div>
                    </article>`).join('')
                : '<p>No hay mascotas disponibles en esta categoría.</p>';
        }

        function filtrar(tipo, boton) {
            document.querySelectorAll('.filtros button').forEach((btn) => btn.classList.remove('activo'));
            boton.classList.add('activo');
            tipoActual = tipo;
            mostrarAnimales(tipo);
        }

        document.getElementById('catalogo').addEventListener('click', (event) => {
            const boton = event.target.closest('button[data-id]');
            if (boton) abrirModal(Number(boton.dataset.id));
        });

        function abrirModal(idMascota) {
            mascotaElegida = animales.find((a) => a.id_mascota === idMascota);
            if (!mascotaElegida) return;
            document.getElementById('mascota').value = mascotaElegida.nombre;
            document.getElementById('mascotaSeleccionada').textContent =
                `Estás solicitando adoptar a: ${mascotaElegida.nombre}`;
            document.getElementById('resultado').textContent = '';
            document.getElementById('modal').classList.add('visible');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('visible');
        }

        document.getElementById('formAdopcion').addEventListener('submit', async function (event) {
            event.preventDefault();
            const resultado = document.getElementById('resultado');
            const campos = Object.fromEntries(
                [...new FormData(this)].map(([clave, valor]) => [clave, String(valor).trim()])
            );
            const boton = this.querySelector('button[type="submit"]');
            boton.disabled = true;

            // Sin .select(): un visitante puede enviar solicitudes, pero no leerlas.
            const { error } = await sb.from('solicitud_adopcion').insert({
                id_mascota: mascotaElegida?.id_mascota ?? null,
                mascota: mascotaElegida?.nombre || document.getElementById('mascota').value,
                nombre: campos.nombre,
                celular: campos.celular,
                direccion: campos.direccion,
                correo: campos.correo,
                mensaje: campos.mensaje
            });
            boton.disabled = false;

            if (error) {
                console.error('Error al enviar la solicitud:', error);
                resultado.style.color = '#b91c1c';
                resultado.textContent = 'No se pudo enviar la solicitud. Intenta nuevamente.';
                return;
            }
            resultado.style.color = '#047857';
            resultado.textContent = 'Solicitud enviada correctamente. ¡Gracias!';
            this.reset();
        });

        cargarMascotas();
    </script>
</body>
</html>
