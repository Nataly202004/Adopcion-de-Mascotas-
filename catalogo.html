<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellas Felices - Catálogo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0fdfa;
            color: #134e4a;
        }
        header {
            background: #115e59;
            color: white;
            padding: 24px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        header h1 { margin: 0; }
        header button {
            background: #f87171;
            border: 0;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
        }
        main { max-width: 1200px; margin: auto; padding: 35px 20px; }
        .presentacion { text-align: center; margin-bottom: 25px; }
        .filtros { text-align: center; margin-bottom: 25px; }
        .filtros button {
            border: 0;
            background: #99f6e4;
            color: #115e59;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .filtros button.activo { background: #0d9488; color: white; }
        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }
        .animal {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 16px #0f766e22;
        }
        .animal img {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }
        .animal-info { padding: 18px; }
        .animal-info h3 { margin: 0 0 8px; color: #115e59; }
        .animal-info p { margin: 6px 0; color: #64748b; }
        .animal-info button, .formulario button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            background: #0d9488;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .animal-info button:hover, .formulario button:hover { background: #115e59; }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            inset: 0;
            background: #0008;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.visible { display: flex; }
        .contenido-modal {
            background: white;
            width: 100%;
            max-width: 520px;
            max-height: 95vh;
            overflow-y: auto;
            border-radius: 18px;
            padding: 25px;
            position: relative;
        }
        .cerrar {
            position: absolute;
            top: 12px;
            right: 18px;
            border: 0;
            background: none;
            font-size: 28px;
            color: #64748b;
            cursor: pointer;
        }
        .formulario label {
            display: block;
            margin-top: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .formulario input, .formulario textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }
        .formulario textarea { min-height: 100px; resize: vertical; }
        #resultado { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>🐾 Huellas Felices</h1>
        <button onclick="cerrarSesion()">Cerrar sesión</button>
    </header>

    <main>
        <section class="presentacion">
            <h2>Encuentra a tu nuevo mejor amigo</h2>
            <p>Conoce nuestros perros y gatos disponibles para adopción.</p>
        </section>

        <div class="filtros">
            <button class="activo" onclick="filtrar('todos', this)">Todos</button>
            <button onclick="filtrar('perro', this)">Perros</button>
            <button onclick="filtrar('gato', this)">Gatos</button>
        </div>

        <section id="catalogo" class="catalogo"></section>
    </main>

    <div id="modal" class="modal">
        <div class="contenido-modal">
            <button class="cerrar" onclick="cerrarModal()" aria-label="Cerrar">×</button>
            <h2>Solicitud de adopción</h2>
            <p id="mascotaSeleccionada"></p>

            <form id="formAdopcion" class="formulario">
                <input type="hidden" id="mascota">

                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" required>

                <label for="celular">Celular</label>
                <input id="celular" name="celular" type="tel" required>

                <label for="direccion">Dirección</label>
                <input id="direccion" name="direccion" type="text" required>

                <label for="correo">Correo</label>
                <input id="correo" name="correo" type="email" required>

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje"
                    placeholder="Agrega detalles sobre la mascota y tu solicitud..."
                    required></textarea>

                <button type="submit">Enviar solicitud 🐾</button>
                <div id="resultado"></div>
            </form>
        </div>
    </div>

    <script>
        const animales = [
            ['Luna', 'perro', 'Labrador', 2, 'https://images.unsplash.com/photo-1552053831-71594a27632d?w=600'],
            ['Max', 'perro', 'Pastor alemán', 3, 'https://images.unsplash.com/photo-1589941013453-ec89f33b5e95?w=600'],
            ['Coco', 'perro', 'Beagle', 1, 'https://images.unsplash.com/photo-1505628346881-b72b27e84530?w=600'],
            ['Rocky', 'perro', 'Boxer', 4, 'https://images.unsplash.com/photo-1583512603805-3cc6b41f3edb?q=80&w=580&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'],
            ['Nala', 'perro', 'Golden retriever', 2, 'https://images.unsplash.com/photo-1558788353-f76d92427f16?w=600'],
            ['Toby', 'perro', 'Mestizo', 5, 'https://images.unsplash.com/photo-1735989967755-706e5edcb44b?q=80&w=580&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'],
            ['Maya', 'perro', 'Husky', 3, 'https://images.unsplash.com/photo-1605568427561-40dd23c2acea?w=600'],
            ['Bruno', 'perro', 'Bulldog', 4, 'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=600'],
            ['Simba', 'perro', 'Cocker spaniel', 2, 'https://images.unsplash.com/photo-1517849845537-4d257902454a?w=600'],
            ['Daisy', 'perro', 'Poodle', 1, 'https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=600'],
            ['Michi', 'gato', 'Gato doméstico', 2, 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600'],
            ['Pelusa', 'gato', 'Persa', 3, 'https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600'],
            ['Oliver', 'gato', 'Atigrado', 1, 'https://images.unsplash.com/photo-1519052537078-e6302a4968d4?w=600'],
            ['Milo', 'gato', 'Siamés', 2, 'https://images.unsplash.com/photo-1561948955-570b270e7c36?w=600'],
            ['Canela', 'gato', 'Carey', 4, 'https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=600'],
            ['Tom', 'gato', 'Mestizo', 5, 'https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?w=600'],
            ['Lola', 'gato', 'Angora', 2, 'https://images.unsplash.com/photo-1574158622682-e40e69881006?w=600'],
            ['Nina', 'gato', 'Gato blanco', 1, 'https://images.unsplash.com/photo-1495366822987-7c75f0fcbab4?w=600'],
            ['Simón', 'gato', 'Gato negro', 3, 'https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=600'],
            ['Cleo', 'gato', 'Gato tricolor', 2, 'https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=600']
        ];

        function mostrarAnimales(tipo = 'todos') {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            animales
                .filter(animal => tipo === 'todos' || animal[1] === tipo)
                .forEach(animal => {
                    const [nombre, especie, raza, edad, imagen] = animal;
                    catalogo.innerHTML += `
                        <article class="animal">
                            <img src="${imagen}" alt="${nombre}">
                            <div class="animal-info">
                                <h3>${nombre}</h3>
                                <p><strong>Especie:</strong> ${especie}</p>
                                <p><strong>Raza:</strong> ${raza}</p>
                                <p><strong>Edad:</strong> ${edad} año(s)</p>
                                <button onclick="abrirModal('${nombre}')">
                                    Me interesa adoptar
                                </button>
                            </div>
                        </article>
                    `;
                });
        }

        function filtrar(tipo, boton) {
            document.querySelectorAll('.filtros button')
                .forEach(btn => btn.classList.remove('activo'));
            boton.classList.add('activo');
            mostrarAnimales(tipo);
        }

        function abrirModal(nombre) {
            document.getElementById('mascota').value = nombre;
            document.getElementById('mascotaSeleccionada').textContent =
                `Estás solicitando adoptar a: ${nombre}`;
            document.getElementById('resultado').textContent = '';
            document.getElementById('modal').classList.add('visible');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('visible');
        }

        document.getElementById('formAdopcion').addEventListener('submit', async function(event) {
            event.preventDefault();

            const datos = Object.fromEntries(new FormData(this));
            const resultado = document.getElementById('resultado');

            try {
                const respuesta = await fetch('/api/solicitudes/adopcion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                if (!respuesta.ok) throw new Error();

                resultado.style.color = '#047857';
                resultado.textContent = 'Solicitud enviada correctamente. ¡Gracias!';
                this.reset();
            } catch {
                resultado.style.color = '#b91c1c';
                resultado.textContent = 'No se pudo enviar la solicitud. Intenta nuevamente.';
            }
        });

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            window.location.href = '/';
        }

        mostrarAnimales();
    </script>
</body>
</html>
